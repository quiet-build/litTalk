name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older in-progress runs of the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm run build

      - name: Lit analyzer
        run: pnpm run lint:lit-analyzer

      - name: Install Playwright Chromium
        run: |
          # Resolve the CLI from the same Playwright dependency as the test runner.
          node <<'NODE'
          const {createRequire} = require('node:module');
          const {dirname, join} = require('node:path');
          const {execFileSync} = require('node:child_process');
          const runnerRequire = createRequire(require.resolve('@web/test-runner-playwright'));
          const cli = join(dirname(runnerRequire.resolve('playwright/package.json')), 'cli.js');
          execFileSync(process.execPath, [cli, 'install', '--with-deps', 'chromium'], {stdio: 'inherit'});
          NODE

      - name: Run tests with coverage
        run: pnpm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
